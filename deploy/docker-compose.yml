# ECS（yyc3-202）公网全栈方案：Caddy 自动 HTTPS → app → MySQL 8.4
# compose 自动读取本目录 .env（MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD 必填）
# 前置：项目根执行 npm run build && npm run build:server
name: baby-mochen

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M   # 成长相册单图上限 12MB，留余量
    environment:
      MYSQL_DATABASE: yyc3_baby_mochen
      MYSQL_USER: bgl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 配置 MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: mysql://bgl:${MYSQL_PASSWORD}@db:3306/yyc3_baby_mochen
      # 鉴权变量按需透传：AUTH_JWKS_URL / AUTH_SIGNIN_URL / APP_ID / APP_SECRET ...
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [frontend]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  backend:
  frontend:
